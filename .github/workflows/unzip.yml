name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o PitachokHudBuilder_v0.7.zip
          cp -r PitachokHudBuilder/. .
          rm -rf PitachokHudBuilder PitachokHudBuilder_v0.7.zip
          git config user.name github-actions
          git config user.email actions@github.com
          git add -A
          git commit -m "Add Pitachok HUD Builder v0.7"
          git push
